name: Zero Data Loss & CI/CD Protection Gate

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  zero-data-loss-gate:
    name: Zero Data Loss Verification & Production Safety Gate
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: |
          npm ci --prefer-offline || npm install
          if [ -d "18_DEVELOPMENT/Backend" ]; then
            cd 18_DEVELOPMENT/Backend && (npm ci --prefer-offline || npm install) && cd ../..
          fi

      - name: 4. TypeScript Type Checking
        run: npm run type-check

      - name: 5. Database Migration Safety Audit (Zero Destructive Drops)
        run: npx tsx scripts/zero-data-loss/migration-safety-analyzer.ts

      - name: 6. Data Integrity Audit & Baseline Parity
        run: npx tsx scripts/zero-data-loss/data-integrity-monitor.ts

      - name: 7. Automated Point-in-Time Database Backup & Checksum Verification
        run: npx tsx scripts/zero-data-loss/db-backup-engine.ts

      - name: 8. Execute Automated Test Suites
        run: npm test
        env:
          NODE_PATH: ./node_modules:./18_DEVELOPMENT/Backend/node_modules

      - name: 9. Next.js Production Build Validation
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.bharatyatra.in
          NEXT_PUBLIC_SUPABASE_URL: https://uedmguvljhsvbndwkruz.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
