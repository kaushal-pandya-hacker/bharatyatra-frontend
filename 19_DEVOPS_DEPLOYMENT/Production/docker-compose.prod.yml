version: '3.8'

services:
  backend:
    image: ghcr.io/chalofarva/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: 4000
      NODE_ENV: production
      AI_SERVICE_URL: http://ai_service:8000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4000:4000"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  ai_service:
    image: ghcr.io/chalofarva/ai-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  frontend:
    image: ghcr.io/chalofarva/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.chalofarva.com/api/v1
      PORT: 3000
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
